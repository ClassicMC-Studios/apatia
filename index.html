<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apatia - Dez Mil Mais Comuns</title>
    <link rel="stylesheet" href="./apatia.css">
    <link rel="shortcut icon" href="https://guyotjs.github.io/duckclear2.png" type="image/x-icon">

<!-- DATA VALUES -->
<body data="{question:'',subtext:'',options:[],next:false,complete:false}">
    <!-- BACKGROUND -->
    <div class="green-background">&nbsp;</div>
    <!-- TITLE -->
    <div class="title-marker">Apatia</div>
    <div class="container" if="!complete">
        <br><br><br><br>
        <span class="question-foreign" react>{{question}}</span>
        <br>
        <sub class="translation" react>{{subtext}}</sub>
        <br/><br><br><br>
        <!-- INTERACTIVE BUTTONS -->
        <div class="buttons">
            <button onclick="answer(0)" id="one" class="button" react>{{options[0][0]}}</button>
            <button onclick="answer(1)" id="two" class="button" react>{{options[1][0]}}</button>
            <button onclick="answer(2)" id="three" class="button" react>{{options[2][0]}}</button>
            <button onclick="answer(3)" id="four" class="button" react>{{options[3][0]}}</button>
        </div>
        <!-- COLORING FOR BUTTONS -->
        <div class="buttons colors">
            <button id="color-one" class="button color">&nbsp;</button>
            <button id="color-two" class="button color">&nbsp;</button>
            <button id="color-three" class="button color">&nbsp;</button>
            <button id="color-four" class="button color">&nbsp;</button>
        </div>
        <br>
        <button onclick="next()" if="next" id="next" class="continue-button">Continue</button>
        <div if="!next" class="hidden-button">&nbsp;</div>
    </div>
    <div class="true-center container" if="complete">
        <h1 class="true-serif no-bold">You have completed every question.</h1>
    </div>

</html>
